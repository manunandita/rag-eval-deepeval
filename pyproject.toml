[project]
name = "rag-evaluation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nandita Manu", email = "manunandita2005@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.3.4",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.8.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.8.5",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.57.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
rag-evaluation = "rag_evaluation:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
